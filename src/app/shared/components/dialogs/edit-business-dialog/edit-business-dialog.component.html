<h2 mat-dialog-title>Editar Perfil</h2>
<mat-dialog-content class="space-y-4">
  <form [formGroup]="form" class="p-4 flex flex-col gap-4">
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Nombre Negocio</mat-label>
      <input matInput maxlength="25" formControlName="nombre_negocio" />
    </mat-form-field>

    <!-- //NEW -->
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Slug del negocio</mat-label>
      <input matInput maxlength="25" formControlName="brand" />
    </mat-form-field>
    <!-- //NEW -->

    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="descripcion" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Logo URL</mat-label>
      <input matInput formControlName="logo_url" />
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Alias</mat-label>
      <input matInput formControlName="alias_negocio" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <div mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()">Cancelar</button>
    <button mat-stroked-button color="primary" (click)="onSave()">Aceptar</button>
  </div>
</mat-dialog-actions>
