<div class="w-full sm:w-9/12  mx-auto  p-6  ">
  <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4">Códigos de seguimiento</h2>

  <div *ngIf="ultimoCodigo" class="mb-6 p-4 bg-green-100 border-l-4 border-green-500 text-green-800 rounded">
    <div class="flex items-start"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        stroke-width="1.5" stroke="currentColor" class="size-6 me-2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
      </svg>
      <p class="font-semibold ">
        ¡Compra realizada con éxito!</p>
    </div>
    <p>
      Tu código de seguimiento es:
      <span class="font-mono font-bold bg-white px-2 py-1 rounded shadow-sm">{{ ultimoCodigo }}</span>
    </p>
    <p class="text-sm text-gray-600 mt-1">Guardalo para revisar el estado de tu pedido.</p>
    <p class="text-xs text-gray-600 mt-1">Los códigos se eliminan automáticamente luego de 24hs</p>
  </div>

  <div *ngIf="codigos.length > 0; else sinCodigos">
    <ul class="space-y-3">
      <li *ngFor="let codigo of codigos" class="flex justify-between items-center p-3 rounded-lg border transition-all"
        [ngClass]="{
          'bg-green-50 border-green-400': codigo === ultimoCodigo,
          'bg-gray-50 dark:bg-gray-200 dark:border-gray-600 border-gray-300': codigo !== ultimoCodigo
        }">
        <span class="font-mono text-sm sm:text-base"
          [ngClass]="{ 'font-bold text-green-700': codigo === ultimoCodigo }">
          {{ codigo }}
        </span>
        <div *ngIf="codigo === ultimoCodigo"
          class="text-xs font-bold text-green-800 border border-green-600 rounded px-2 py-2">Código
          más reciente</div>
        <button *ngIf="codigo === ultimoCodigo" (click)="copiar(codigo)"
          class="px-3 py-1 text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white rounded shadow">
          Copiar
        </button>
      </li>
    </ul>
  </div>

  <ng-template #sinCodigos>
    <p class="text-gray-500 dark:text-gray-400 text-sm">No hay códigos guardados todavía.</p>
  </ng-template>
</div>
