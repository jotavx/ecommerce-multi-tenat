<main class="pb-14 bg-gradient-to-br from-white to-white dark:from-gray-900 dark:to-gray-800">
  <div class="text-center py-4 lg:px-4"
    *ngIf="show && configCargada && (!configService.isOpen() || configService.cerradoTemporalmente)">
    <div
      class="p-2 bg-gradient-to-r from-cyan-700 to-blue-700 items-center text-blue-100 leading-none lg:rounded-full flex lg:inline-flex"
      role="alert">
      <span class="flex rounded-full bg-blue-500 uppercase px-2 py-1 text-xs font-bold mr-3"><svg
          xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5">
          <path fill-rule="evenodd"
            d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm-3.536-3.475a.75.75 0 0 0 1.061 0 3.5 3.5 0 0 1 4.95 0 .75.75 0 1 0 1.06-1.06 5 5 0 0 0-7.07 0 .75.75 0 0 0 0 1.06ZM9 8.5c0 .828-.448 1.5-1 1.5s-1-.672-1-1.5S7.448 7 8 7s1 .672 1 1.5Zm3 1.5c.552 0 1-.672 1-1.5S12.552 7 12 7s-1 .672-1 1.5.448 1.5 1 1.5Z"
            clip-rule="evenodd" />
        </svg>

      </span>
      <span class="font-semibold mr-2 text-left flex-auto">Nuestro local se encuentra cerrado. Vuelve más tarde</span>

    </div>
  </div>
  <router-outlet></router-outlet>
</main>
