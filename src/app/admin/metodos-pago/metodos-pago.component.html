<div class="p-6"></div>
<div class="p-6 max-w-3xl mx-auto bg-white dark:bg-gray-800 shadow-lg rounded-2xl">
  <div class="mb-8">
    <h2 class="text-3xl font-bold mb-2 text-gray-800 dark:text-white">Configura tus métodos de pago</h2>
    <p class="text-gray-600 dark:text-gray-300">Agrega los métodos de pago que acepta tu negocio.</p>
  </div>

  <div *ngFor="let metodo of metodosPago.metodos" class="mt-8 p-5 bg-white dark:bg-gray-700 rounded-xl shadow-sm">
    <div class="flex items-center justify-between">
      <div>
        <p class="text-lg font-medium text-gray-800 dark:text-white">{{ metodo.label }}</p>
        <p class="text-sm text-gray-600 dark:text-gray-300">
          {{ metodo.active ? 'Activado' : 'Desactivado' }}
        </p>
      </div>
      <mat-slide-toggle [checked]="metodo.active" (change)="toggleMetodo(metodo.name)" color="warn">
        <span class="text-sm font-medium text-gray-800 dark:text-gray-100">
          {{ metodo.active ? 'Desactivar' : 'Activar' }}
        </span>
      </mat-slide-toggle>
    </div>
  </div>


</div>
